<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Своя интонация</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="eyebrow">ЛОКАЛЬНАЯ TTS-СТУДИЯ</span><h1>Своя интонация</h1></div><button id="login">Войти</button></header>
<main><section><h2>1. Голос</h2><p class="muted">Запишите 10–30 секунд чистой речи или загрузите WAV, MP3, M4A, WebM.</p><div class="rec"><canvas id="meter"></canvas><strong id="timer">00:00</strong><button id="record">● Записать</button><select id="devices"></select></div><audio id="preview" controls></audio><div class="row"><input id="name" placeholder="Название голоса"><input id="file" type="file" accept="audio/*"><button id="save">Сохранить профиль</button></div><div id="profiles"></div></section>
<section><h2>2. Текст и подача</h2><div class="modes"><button data-mode="fairy" class="active">Сказка</button><button data-mode="poem">Стихотворение</button><button data-mode="lullaby">Колыбельная</button></div><textarea id="text" maxlength="100000" placeholder="Однажды в ти́хом лесу…"></textarea><div class="row"><button id="stress">Поставить / снять ударение</button><span id="count">0 знаков</span></div><details><summary>Словарь произношений</summary><input id="dw" placeholder="замок"><input id="dp" placeholder="зам+ок"><button id="ds">Добавить</button></details><button class="primary" id="generate">Создать озвучку</button></section>
<section><h2>3. Очередь и результаты</h2><div id="jobs"></div></section></main><footer>Все записи и результаты остаются на этом сервере.</footer><script src="/app.js"></script></body></html>
