services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes: ["./data:/data", "./models:/models"]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8000/api/health"], interval: 15s, timeout: 5s, retries: 5}
  worker:
    build: .
    restart: unless-stopped
    command: ["python","-c","from app.worker import run; run()"]
    env_file: .env
    volumes: ["./data:/data", "./models:/models"]
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment: ["STUDIO_HOST=${STUDIO_HOST:-localhost}"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./data/caddy:/data", "./data/caddy-config:/config"]
    depends_on: [web]
volumes: {}
